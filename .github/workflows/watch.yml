name: newswatch
# Self-chaining: every run first queues the next run (it waits in the concurrency group and starts the moment this one
# ends or fails), so the watcher never depends on GitHub's cron, which fired hours late or not at all.
#   07:00-23:00 IST  watch news (one run covers up to 5h45m)
#   23:00-07:00 IST  one idle run waits for 07:00, so the morning start is guaranteed
# The cron below is only a backup restarter in case the chain is ever broken.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "max minutes for this run (<= 345)"
        required: true
        default: "345"

permissions:
  actions: write
  contents: read

concurrency:
  group: newswatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Queue the next run (keeps the chain going)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run newswatch -R "${{ github.repository }}" -f minutes=345 || echo "could not queue the next run"
      - name: Window
        id: win
        run: |
          mins="${{ github.event.inputs.minutes }}"; mins=${mins:-345}
          h=$(TZ=Asia/Kolkata date +%-H); m=$(TZ=Asia/Kolkata date +%-M); now=$((h * 60 + m))
          if [ $now -ge 420 ] && [ $now -lt 1380 ]; then
            end=$((now + mins)); [ $end -gt 1380 ] && end=1380
            printf -v until "%02d:%02d" $((end / 60)) $((end % 60))
            echo "mode=watch" >> "$GITHUB_OUTPUT"; echo "until=$until" >> "$GITHUB_OUTPUT"; echo "watching until $until IST"
          else
            if [ $now -ge 1380 ]; then wait=$((1440 - now + 420)); else wait=$((420 - now)); fi
            [ $wait -gt $mins ] && wait=$mins
            echo "mode=sleep" >> "$GITHUB_OUTPUT"; echo "wait=$wait" >> "$GITHUB_OUTPUT"; echo "overnight: waiting $wait minutes"
          fi
      - name: Overnight wait
        if: steps.win.outputs.mode == 'sleep'
        run: sleep $(( ${{ steps.win.outputs.wait }} * 60 ))
      - uses: actions/checkout@v4
        if: steps.win.outputs.mode == 'watch'
      - uses: actions/setup-python@v5
        if: steps.win.outputs.mode == 'watch'
        with:
          python-version: "3.12"
          cache: pip
      - name: OCR for news images (optional)
        if: steps.win.outputs.mode == 'watch'
        run: |
          for i in 1 2; do sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr && break; sleep 20; done || true
          command -v tesseract || echo "tesseract unavailable: image posts will be read from captions only"
      - if: steps.win.outputs.mode == 'watch'
        run: pip install -r requirements.txt
      - name: Restore state (last message ids, today's alerts, Breeze session sealed with STATE_KEY)
        if: steps.win.outputs.mode == 'watch'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: nwstate-${{ github.run_id }}
          restore-keys: nwstate-
      - name: Watch
        if: steps.win.outputs.mode == 'watch'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BACKUP_MODEL: ${{ secrets.LLM_BACKUP_MODEL }}
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          NW_LOCAL_FNO: /nonexistent
        run: |
          mkdir -p state
          if [ ! -f state/levels.json ] || [ "$(find state/levels.json -mmin +600 2>/dev/null)" ]; then python watch.py levels || true; fi
          python watch.py run --until "${{ steps.win.outputs.until }}"
      - name: Keep a copy of the paper-trade results (downloadable for 90 days)
        if: always() && steps.win.outputs.mode == 'watch' && hashFiles('state/scores.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scores-${{ github.run_id }}
          path: state/scores.jsonl
          retention-days: 90
      - name: Save state
        if: always() && steps.win.outputs.mode == 'watch'
        uses: actions/cache/save@v4
        with:
          path: state
          key: nwstate-${{ github.run_id }}
